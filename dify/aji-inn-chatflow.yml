app:
  description: 一个会记仇的客栈掌柜：把玩家的恶作剧写进 PowerContext 长期记忆，换一个新会话仍能翻旧账，并在回答里给出记忆引用。
  icon: '🏮'
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 阿吉客栈 · 记仇掌柜
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext 服务基地址，不含 /mcp，末尾不要加斜杠，例如 https://<your-host>
    id: env-powercontext-base-url
    name: POWERCONTEXT_BASE_URL
    selector:
    - env
    - POWERCONTEXT_BASE_URL
    value: https://<your-powercontext-host>
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 100
        video_file_size_limit: 500
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 客官里边请。我是阿吉客栈的掌柜。你说过的每一件混账事，我都记在账本上——换了新会话也翻得出来。要不要试试？
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 记住，我把你后厨的铜锅砸了个豁口。
    - 掌柜的，你还记得我上次干了什么吗？
    - 我偷偷往你酒坛里兑了水。
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: 1759900000001-source-1759900000002-target
      source: '1759900000001'
      sourceHandle: source
      target: '1759900000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
