      id: 1759900000003-source-1759900000004-target
      source: '1759900000003'
      sourceHandle: source
      target: '1759900000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: 1759900000004-source-true-1759900000005-target
      source: '1759900000004'
