      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: 1759900000007-source-1759900000008-target
      source: '1759900000007'
      sourceHandle: source
      target: '1759900000008'
